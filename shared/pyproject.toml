[project]
name = "shared"
version = "0.1.0"
description = "Common library for all services"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aio-pika>=9.3",
    "structlog>=23.1",
    "python-json-logger>=2.0",
    "tenacity>=8.2",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"